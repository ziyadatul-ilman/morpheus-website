version: "3.8"

services:
  app:
    build: .
    container_name: xi-tkj-3-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: tkj3_user
      DB_PASSWORD: tkj3_password
      DB_NAME: xi_tkj_3_profile
      NEXT_PUBLIC_SCHOOL_NAME: "SMK Telkom Malang"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tkj3-net

  db:
    image: mariadb:11
    container_name: xi-tkj-3-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: xi_tkj_3_profile
      MYSQL_USER: tkj3_user
      MYSQL_PASSWORD: tkj3_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tkj3-net

  adminer:
    image: adminer
    container_name: xi-tkj-3-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - tkj3-net

networks:
  tkj3-net:
    driver: bridge

volumes:
  db_data:
